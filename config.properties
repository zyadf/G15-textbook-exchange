# ITS66704 AT2 - application configuration
# ------------------------------------------------------------------
# 1. Your group number (from the module group list). This decides your
#    scenario, house-rule values and watermark. Do NOT change it later.
#    (Follow your group registration)
group.number=15

# 2. Which model provider to use: OLLAMA | LMSTUDIO | OPENAI | ANTHROPIC
#    OLLAMA   : install https://ollama.com, then:  ollama pull qwen3:8b
#    LMSTUDIO : start LM Studio's local server (OpenAI-compatible, port 1234)
#    OPENAI / ANTHROPIC : use the key your lecturer issued (see apiKeyEnv)
#llm.provider=OLLAMA
llm.provider=ANTHROPIC

# Model name. Tool calling needs a capable model:
#   Ollama   : qwen3:8b (recommended, ~5 GB)  | qwen3:4b for 8 GB laptops
#   LM Studio: the identifier shown in LM Studio, e.g. qwen/qwen3-8b
#   OpenAI   : gpt-5-mini        Anthropic: claude-haiku-5-5
#llm.model=gemma4:12b
#llm.model=qwen3:8b
llm.model=claude-sonnet-4-6

# Leave blank for the provider default.
# Ollama default http://localhost:11434   LM Studio http://localhost:1234/v1
# Or on another machine over the LAN, e.g. llm.baseUrl=http://192.168.0.119:11434

llm.baseUrl=

# NAME of the environment variable that holds your API key (never the key itself).
#   e.g. OPENAI_API_KEY or ANTHROPIC_API_KEY. Leave blank for Ollama.
#llm.apiKeyEnv=
llm.apiKeyEnv=ANTHROPIC_API_KEY

llm.temperature=0.2
llm.timeoutSeconds=180

# Optional bonus (MCP client). Requires Node.js 20+ for npx.
mcp.enabled=false

scenarios.dir=scenarios
runtime.dir=runtime

# Testing only: freeze "now" (local time) so house rules that depend on the time of day can be
# demonstrated. Leave blank for the real clock. Your tutor will set this during the demo.
# Example: clock.fixed=2026-11-02T15:30
clock.fixed=
